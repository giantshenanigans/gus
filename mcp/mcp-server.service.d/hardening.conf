# Sandboxing for mcp-server.service.
#
# Install to /etc/systemd/system/mcp-server.service.d/hardening.conf, then
# `systemctl daemon-reload` and restart. Unlike the main unit this file holds no
# secrets, so it is the authoritative copy -- keep it here, not only on the host.
#
# A drop-in rather than an edit to the main unit: that unit carries
# Environment= and EnvironmentFile= values which are not in git, so it must not
# be rewritten from the repo.
#
# These four directives were declared by the old openclaw-mcp.service, which
# never actually ran -- the live unit was hand-installed without them, so the
# server ran unsandboxed until 2026-08-08.
#
# ProtectSystem=strict makes the whole filesystem read-only apart from
# ReadWritePaths, which is why /home/openclaw is listed: the server's working
# directory, node_modules and the shared workspace all live under it. Reads
# outside it still work, so /etc/openclaw/mcp-tokens.json loads fine, and
# connecting to the Postgres unix socket is unaffected -- connect() does not
# write to the filesystem.

[Service]
NoNewPrivileges=true
ProtectSystem=strict
ReadWritePaths=/home/openclaw
PrivateTmp=true
